<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فصائل الدم - سنار</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,Arial}
body{margin:0;background:#fff5f5}
header{background:#e11d48;color:#fff;text-align:center;padding:16px;font-size:20px;font-weight:bold}
.wrap{max-width:480px;margin:auto;padding:12px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 12px #0001;margin-bottom:16px}
h2{text-align:center;color:#e11d48}
p.sub{text-align:center;color:#666;font-size:13px}
label{display:block;font-weight:bold;margin:14px 0 6px}
input,select{width:100%;padding:13px;border:1px solid #eee;background:#f8f8f8;border-radius:10px;font-size:15px}
button.main{width:100%;background:#e11d48;color:#fff;border:none;padding:15px;border-radius:10px;font-size:17px;font-weight:bold;margin-top:18px}
.item{background:#fff;border:1px solid #ffe4e6;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.badge{background:#ffe4e6;color:#e11d48;padding:6px 12px;border-radius:20px;font-weight:bold}
.small{color:#666;font-size:12px}
.call{background:#e11d48;color:#fff;padding:8px 12px;border-radius:8px;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<header>فصائل الدم</header>
<div class="wrap">
<div class="card">
<h2>اطلب دم</h2><p class="sub">دخل الفصيلة المحتاجها، وحنوريك المتبرعين القريبين منك</p>
<label>نوع الفصيلة المطلوبة</label><select id="r_blood"><option>O+</option><option>O-</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option></select>
<label>نوع الحالة</label><select id="r_urgent"><option>مستعجلة جدا - محتاج اليوم</option><option>مستعجلة - خلال يومين</option><option>عادية</option></select>
<label>محتاج الدم في ياتو يوم؟</label><select id="r_when"><option>اليوم</option><option>بكرة</option><option>بعد بكرة</option></select>
<label>اسم المريض / المستشفى (اختياري)</label><input id="r_patient" placeholder="مثال: مستشفى سنار التعليمي">
<label>📞 رقم التواصل</label><input id="r_phone" placeholder="09xxxxxxxxx">
<label>📱 رقم واتساب (اختياري)</label><input id="r_whats" placeholder="09xxxxxxxxx">
<button class="main" onclick="sendReq()">🔍 ابحث عن متبرعين</button>
</div>
<div class="card">
<h2>سجل كمتبرع</h2><p class="sub">املا بياناتك، ووقت ما زول يحتاج فصيلتك حنلقاك طوالي</p>
<label>الاسم الكامل</label><input id="d_name" placeholder="مثال: محمد أحمد">
<label>مكان السكن في سنار</label><input id="d_place" placeholder="مثال: سنار - حي القلعة">
<label>نوع الفصيلة</label><select id="d_blood"><option>O+</option><option>O-</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option></select>
<label>رقم الهاتف - واتساب</label><input id="d_phone" placeholder="09xxxxxxxxx">
<button class="main" onclick="sendDonor()">💗 حفظ بياناتي كمتبرع</button>
</div>
<h3 style="text-align:center;color:#e11d48">المتبرعين: <span id="cDonors">0</span> | الطلبات: <span id="cReqs">0</span></h3>
<div id="listDonors"></div><div id="listReqs"></div>
</div>
<script>
const API = "https://script.google.com/macros/s/AKfycbxM_FB92ppiGjLGGymWAYiTZY0mzSDG8zqP8RyAnh_2OYSQ9EcMGuo58T5F04LSeDBU/exec";
async function loadAll(){
  try{
    let d = await fetch(API+"?type=donors").then(r=>r.json());
    let r = await fetch(API+"?type=reqs").then(r=>r.json());
    if(d.length) localStorage.setItem("donors", JSON.stringify(d));
    if(r.length) localStorage.setItem("reqs", JSON.stringify(r));
  }catch(e){}
  render();
}
function render(){
  let donors = JSON.parse(localStorage.getItem("donors")||"[]");
  let reqs = JSON.parse(localStorage.getItem("reqs")||"[]");
  document.getElementById("cDonors").textContent = donors.length;
  document.getElementById("cReqs").textContent = reqs.length;
  document.getElementById("listDonors").innerHTML = donors.map(x=>`<div class="item"><div><b>${x.name}</b><div class="small">${x.place} - ${x.phone}</div></div><div><span class="badge">${x.blood}</span><br><a class="call" href="tel:${x.phone}">اتصل</a></div></div>`).join("");
  document.getElementById("listReqs").innerHTML = reqs.map(x=>`<div class="item"><div><b>محتاج ${x.blood}</b><div class="small">${x.patient||""} - ${x.when} - ${x.urgent}</div><div class="small">${x.phone}</div></div><a class="call" href="tel:${x.phone}">اتصل</a></div>`).join("");
}
async function sendDonor(){
  let obj = {type:"donor", name:document.getElementById("d_name").value, place:document.getElementById("d_place").value, blood:document.getElementById("d_blood").value, phone:document.getElementById("d_phone").value};
  if(!obj.name||!obj.phone) return alert("اكتب اسمك ورقمك");
  let arr = JSON.parse(localStorage.getItem("donors")||"[]"); arr.unshift(obj); localStorage.setItem("donors", JSON.stringify(arr));
  fetch(API,{method:"POST",mode:"no-cors",body:JSON.stringify(obj)});
  alert("تم حفظك كمتبرع ❤️"); render();
}
async function sendReq(){
  let obj = {type:"req", blood:document.getElementById("r_blood").value, urgent:document.getElementById("r_urgent").value, when:document.getElementById("r_when").value, patient:document.getElementById("r_patient").value, phone:document.getElementById("r_phone").value, whats:document.getElementById("r_whats").value};
  if(!obj.phone) return alert("اكتب رقم التواصل");
  let arr = JSON.parse(localStorage.getItem("reqs")||"[]"); arr.unshift(obj); localStorage.setItem("reqs", JSON.stringify(arr));
  fetch(API,{method:"POST",mode:"no-cors",body:JSON.stringify(obj)});
  alert("تم نشر طلبك"); render();
}
loadAll();
</script>
</body>
</html>
